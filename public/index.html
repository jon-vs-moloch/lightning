<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightning</title>
<meta name="description" content="Branch inspector for the Lightning runtime">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M13 2 4 14h7l-1 8 9-12h-7z' fill='%23f4b400'/%3E%3C/svg%3E">
<style>
/* ------------------------------------------------------------------
   Lightning inspector. One static file, no build step, no network.
   Type scale 12/13/14/16/20/28 · spacing 4/8/12/16/24/32 · radius 8/12
   ------------------------------------------------------------------ */
:root {
  color-scheme: light;
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --border: #e2e5ea; --border-strong: #cfd4dc;
  --text: #14171f; --muted: #5b6270; --faint: #8a919e;
  --accent: #5b4cf0; --accent-ink: #ffffff; --accent-soft: #eeecfe; --bolt: #f4b400;
  --hot: #e5484d; --hot-bg: #fdecec; --warm: #d97706; --warm-bg: #fdf1e2;
  --cold: #3b82f6; --cold-bg: #e8f0fe; --frozen: #64809a; --frozen-bg: #edf2f7;
  --demo: #92400e; --demo-bg: #fef3c7; --demo-border: #f5d27a;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0d12; --surface: #12151c; --surface-2: #181c25; --border: #242935; --border-strong: #323949;
  --text: #e8eaf0; --muted: #a0a7b4; --faint: #6f7785;
  --accent: #8b7dff; --accent-ink: #0b0d12; --accent-soft: rgba(139, 125, 255, .14); --bolt: #ffc933;
  --hot: #ff6369; --hot-bg: rgba(255, 99, 105, .13); --warm: #ffa94d; --warm-bg: rgba(255, 169, 77, .13);
  --cold: #6ea8ff; --cold-bg: rgba(110, 168, 255, .13); --frozen: #a7bccd; --frozen-bg: rgba(167, 188, 205, .12);
  --demo: #fcd34d; --demo-bg: rgba(252, 211, 77, .1); --demo-border: rgba(252, 211, 77, .3);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b0d12; --surface: #12151c; --surface-2: #181c25; --border: #242935; --border-strong: #323949;
    --text: #e8eaf0; --muted: #a0a7b4; --faint: #6f7785;
    --accent: #8b7dff; --accent-ink: #0b0d12; --accent-soft: rgba(139, 125, 255, .14); --bolt: #ffc933;
    --hot: #ff6369; --hot-bg: rgba(255, 99, 105, .13); --warm: #ffa94d; --warm-bg: rgba(255, 169, 77, .13);
    --cold: #6ea8ff; --cold-bg: rgba(110, 168, 255, .13); --frozen: #a7bccd; --frozen-bg: rgba(167, 188, 205, .12);
    --demo: #fcd34d; --demo-bg: rgba(252, 211, 77, .1); --demo-border: rgba(252, 211, 77, .3);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
}
button, textarea { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }

/* Header ------------------------------------------------------------ */
.top {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 16px 32px; border-bottom: 1px solid var(--border); background: var(--surface);
}
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.brand svg { width: 32px; height: 32px; flex: none; }
.brand h1 { margin: 0; font-size: 20px; line-height: 1.2; letter-spacing: -0.01em; }
.brand p { margin: 0; font-size: 13px; color: var(--muted); }
.pill {
  display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface-2); font-size: 13px; white-space: nowrap;
}
.pill.demo { color: var(--demo); background: var(--demo-bg); border-color: var(--demo-border); font-weight: 600; }
.icon-btn {
  display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface); cursor: pointer;
}
.icon-btn:hover { border-color: var(--border-strong); }
.icon-btn svg { width: 18px; height: 18px; }

.notice[hidden] { display: none; }
.notice {
  display: flex; gap: 12px; align-items: flex-start; margin: 0; padding: 12px 32px;
  font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--border);
}
.notice strong { color: var(--text); font-weight: 600; }

/* Layout ------------------------------------------------------------ */
.layout {
  display: grid; gap: 24px; padding: 24px 32px 32px;
  grid-template-columns: 360px minmax(0, 1fr) 300px; align-items: start;
}
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
}
.card > header {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
}
.card h2 {
  margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
}
.card .body { padding: 16px; }

/* Thermal bar ------------------------------------------------------ */
.thermal-bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--surface-2); gap: 2px; }
.thermal-bar span { display: block; }
.legend { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.legend div { font-size: 12px; color: var(--muted); }
.legend b { display: block; font-size: 20px; line-height: 1.2; color: var(--text); font-weight: 600; }

/* Temperature chips ------------------------------------------------- */
.t { --c: var(--faint); --b: var(--surface-2); }
.t-hot { --c: var(--hot); --b: var(--hot-bg); }
.t-warm { --c: var(--warm); --b: var(--warm-bg); }
.t-cold { --c: var(--cold); --b: var(--cold-bg); }
.t-frozen { --c: var(--frozen); --b: var(--frozen-bg); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px;
  font-size: 12px; font-weight: 500; color: var(--c); background: var(--b); white-space: nowrap;
}
.tag {
  display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 12px;
  background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
}

/* Tree --------------------------------------------------------------- */
.tree { list-style: none; margin: 0; padding: 8px; }
.tree ul { list-style: none; margin: 0 0 0 15px; padding: 0 0 0 12px; border-left: 1px solid var(--border); }
.node {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px 10px;
  width: 100%; padding: 8px 10px; border: 1px solid transparent; border-radius: 8px;
  background: none; text-align: left; cursor: pointer;
}
.node:hover { background: var(--surface-2); }
.node[aria-current="true"] { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.node .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node .sub { grid-column: 2 / 4; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--faint); margin-top: -6px; }
.node .count { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.succession { margin: 0 0 4px 30px; font-size: 12px; color: var(--faint); }

/* Detail ------------------------------------------------------------- */
.detail-head { padding: 24px; border-bottom: 1px solid var(--border); }
.detail-head .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.detail-head h2 {
  font-size: 28px; line-height: 1.2; letter-spacing: -0.02em; text-transform: none; color: var(--text); margin: 8px 0 4px;
}
.detail-head p { margin: 0; color: var(--muted); font-size: 16px; }
.lineage { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 16px; font-size: 13px; color: var(--muted); }
.lineage a { color: var(--accent); text-decoration: none; font-family: var(--mono); font-size: 12px; }
.lineage a:hover { text-decoration: underline; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--border); }
.stats div { padding: 16px 24px; border-right: 1px solid var(--border); }
.stats div:last-child { border-right: 0; }
.stats b { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.section { padding: 16px 24px; border-bottom: 1px solid var(--border); }
.section:last-child { border-bottom: 0; }
.section h3 { margin: 0 0 12px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

.timeline { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; flex-wrap: wrap; }
.timeline li {
  display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface-2); min-width: 160px;
}
.timeline li.head { border-color: var(--accent); background: var(--accent-soft); }
.timeline .label { font-weight: 500; }
.timeline .meta { font-size: 12px; color: var(--faint); }

.messages { display: flex; flex-direction: column; gap: 12px; }
.msg { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; }
.msg .role { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); padding-top: 10px; }
.msg .bubble {
  padding: 10px 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border);
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.msg.user .bubble { background: var(--accent-soft); border-color: transparent; }
.msg.assistant .bubble { font-family: var(--mono); font-size: 13px; }
.empty { color: var(--faint); font-size: 13px; padding: 8px 0; }

.composer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: end; }
.composer[hidden] { display: none; }
.composer textarea {
  resize: vertical; min-height: 44px; max-height: 200px; padding: 10px 12px; border-radius: 8px;
  border: 1px solid var(--border-strong); background: var(--surface);
}
.composer textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); outline-offset: 1px; border-color: var(--accent); }
.composer .hint, .composer .error { grid-column: 1 / -1; margin-top: 0; }
.btn {
  height: 44px; padding: 0 18px; border-radius: 8px; border: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font-weight: 600;
}
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-small { height: auto; padding: 4px 10px; font-size: 12px; font-weight: 500; border-radius: 6px; }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
.btn-ghost:hover { border-color: var(--border-strong); color: var(--text); }
.hint { margin-top: 8px; font-size: 12px; color: var(--faint); }
.error { color: var(--hot); font-size: 13px; margin-top: 8px; }

/* Capabilities ------------------------------------------------------- */
.caps { list-style: none; margin: 0; padding: 0; }
.caps li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.caps li:last-child { border-bottom: 0; }
.mode { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; }
.mode-native { color: #15803d; background: rgba(34, 197, 94, .14); }
.mode-emulated { color: var(--warm); background: var(--warm-bg); }
.mode-unsupported { color: var(--faint); background: var(--surface-2); }
:root[data-theme="dark"] .mode-native { color: #4ade80; }
.side { display: flex; flex-direction: column; gap: 24px; }
.side p { margin: 0 0 12px; font-size: 13px; color: var(--muted); }

/* Responsive -------------------------------------------------------- */
@media (max-width: 1180px) {
  .layout { grid-template-columns: 320px minmax(0, 1fr); }
  .side { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; }
}
@media (max-width: 760px) {
  .top { padding: 12px 16px; gap: 12px; }
  .notice { padding: 12px 16px; }
  .layout { grid-template-columns: minmax(0, 1fr); padding: 16px; gap: 16px; }
  #detail { order: -1; }
  .side { grid-template-columns: 1fr; gap: 16px; }
  .detail-head { padding: 16px; }
  .detail-head h2 { font-size: 22px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats div { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .stats div:nth-child(2n) { border-right: 0; }
  .section { padding: 16px; }
  .msg { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .msg .role { padding-top: 0; }
  .composer { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect x=".5" y=".5" width="31" height="31" rx="7.5" fill="#1b1f2a" stroke="#323949"/>
      <path d="M17.5 5 8 18h7l-1.5 9L23 14h-7z" fill="var(--bolt)"/>
    </svg>
    <div>
      <h1>Lightning</h1>
      <p>Branch &amp; checkpoint inspector</p>
    </div>
  </div>
  <span class="pill" id="adapterPill">connecting…</span>
  <button class="icon-btn" id="themeBtn" type="button" title="Toggle theme" aria-label="Toggle theme">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>
<p class="notice" id="notice" hidden></p>

<main class="layout">
  <section class="card" aria-label="Branch tree">
    <header><h2>Branches</h2><span class="faint" id="branchCount"></span></header>
    <ul class="tree" id="tree"></ul>
  </section>

  <section class="card" id="detail" aria-live="polite">
    <div class="detail-head"><p class="muted">Select a branch.</p></div>
  </section>

  <aside class="side">
    <section class="card">
      <header><h2>Thermal state</h2></header>
      <div class="body">
        <div class="thermal-bar" id="thermalBar"></div>
        <div class="legend" id="legend"></div>
      </div>
    </section>
    <section class="card">
      <header><h2>Adapter</h2><span class="faint mono" id="adapterId"></span></header>
      <div class="body">
        <p>What the backend does natively, what Lightning emulates on top, and what is not there yet.</p>
        <ul class="caps" id="caps"></ul>
      </div>
    </section>
  </aside>
</main>

<script>
(() => {
  const TEMPS = ["hot", "warm", "cold", "frozen"];
  const $ = (id) => document.getElementById(id);
  const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // Server-generated labels look like "turn-1792291584906"; show them as "turn · 14:02".
  const label = (c) => {
    const m = /^(.*)-(\d{13})$/.exec(c.label || "");
    return m ? `${m[1]} · ${new Date(Number(m[2])).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}` : (c.label || c.id);
  };
  const ago = (iso) => {
    const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
    return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : `${Math.round(s / 3600)}h ago`;
  };

  // Theme: auto (system) unless the user picked one. Stored per browser only.
  const root = document.documentElement;
  try { const saved = localStorage.getItem("lightning-theme"); if (saved) root.dataset.theme = saved; } catch {}
  const forced = new URLSearchParams(location.search).get("theme");
  if (forced === "light" || forced === "dark") root.dataset.theme = forced;
  $("themeBtn").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("lightning-theme", root.dataset.theme); } catch {}
  });

  let state = { branches: [], adapters: [] };
  function branchFromHash(fallback) {
    const match = (location.hash.match(/branch=([^&]+)/) || [])[1];
    if (match === undefined) return fallback;
    try { return decodeURIComponent(match); } catch { return fallback; }
  }
  let selected = branchFromHash("");

  async function getJson(url, init) {
    const response = await fetch(url, init);
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error || `${response.status}`);
    return payload;
  }

  async function refresh() {
    state = await getJson("/v1/branches");
    if (!selected || !state.branches.some((b) => b.id === selected)) {
      selected = (state.branches.find((b) => b.temperature === "hot") || state.branches[0] || {}).id || "";
    }
    renderHeader();
    renderTree();
    renderThermal();
    renderCaps();
    if (selected) await renderDetail(selected);
  }

  function renderHeader() {
    const adapter = state.adapters.find((a) => a.id === state.defaultBackend) || state.adapters[0];
    const pill = $("adapterPill");
    if (!adapter) { pill.textContent = "no adapter"; return; }
    const isFake = adapter.id === "fake";
    pill.className = isFake ? "pill demo" : "pill";
    pill.innerHTML = isFake
      ? `Demo data · fake adapter`
      : `<span class="dot t t-hot" style="--c:#22c55e"></span>${esc(adapter.label)}`;
    pill.title = isFake ? "Generation is an echo from the FakeAdapter. Branches, checkpoints and thermal state are real runtime state." : adapter.id;
    const caps = adapter.capabilities || {};
    const notice = $("notice");
    if (caps.checkpoint !== "native") {
      notice.hidden = false;
      notice.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex:none;margin-top:2px"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span><strong>Checkpoints are ${esc(caps.checkpoint)}.</strong> Today a checkpoint is a message-level snapshot, not saved KV-cache state. Native cache checkpoints are the next phase of the roadmap.</span>`;
    } else {
      notice.hidden = false;
      notice.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex:none;margin-top:2px"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span><strong>Checkpoints are native.</strong> Each checkpoint is a saved llama.cpp slot KV file; continuing from one restores it into an idle slot so only the new turn is prefilled.</span>`;
    }
  }

  function renderTree() {
    const byParent = new Map();
    for (const b of state.branches) {
      const key = b.parentId && state.branches.some((p) => p.id === b.parentId) ? b.parentId : "";
      if (!byParent.has(key)) byParent.set(key, []);
      byParent.get(key).push(b);
    }
    const order = (list) => list.sort((a, b) => TEMPS.indexOf(a.temperature) - TEMPS.indexOf(b.temperature) || b.priority - a.priority);
    const node = (b) => `
      <li>
        <button class="node t t-${esc(b.temperature)}" data-id="${esc(b.id)}" aria-current="${b.id === selected}">
          <span class="dot"></span>
          <span class="title">${esc(b.title)}</span>
          <span class="count">${b.messageCount} msg</span>
          <span class="sub"><span class="mono">${esc(b.id)}</span><span>${esc(b.kind)}</span></span>
        </button>
        ${b.successorId ? `<div class="succession">succeeded by <span class="mono">${esc(b.successorId)}</span></div>` : ""}
        ${byParent.has(b.id) ? `<ul>${order(byParent.get(b.id)).map(node).join("")}</ul>` : ""}
      </li>`;
    $("tree").innerHTML = order(byParent.get("") || []).map(node).join("") || `<li class="empty">No branches yet. Send a message to <code>/v1/threads/&lt;id&gt;/messages</code>.</li>`;
    $("branchCount").textContent = `${state.branches.length}`;
  }

  function renderThermal() {
    const total = state.branches.length || 1;
    const counts = Object.fromEntries(TEMPS.map((t) => [t, state.branches.filter((b) => b.temperature === t).length]));
    $("thermalBar").innerHTML = TEMPS.filter((t) => counts[t]).map((t) => `<span class="t t-${t}" style="flex:${counts[t] / total};background:var(--c)" title="${t}: ${counts[t]}"></span>`).join("");
    $("legend").innerHTML = TEMPS.map((t) => `<div class="t t-${t}"><b>${counts[t]}</b><span class="chip"><span class="dot"></span>${t}</span></div>`).join("");
  }

  function renderCaps() {
    const adapter = state.adapters.find((a) => a.id === state.defaultBackend) || state.adapters[0];
    if (!adapter) return;
    $("adapterId").textContent = adapter.id;
    const names = { loadModel: "Load model", checkpoint: "Checkpoint", restore: "Restore", freeze: "Freeze", thaw: "Thaw", fork: "Fork", ephemeralConsult: "Ephemeral consult", prefixReuse: "Prefix reuse" };
    $("caps").innerHTML = Object.entries(adapter.capabilities).map(([key, mode]) =>
      `<li><span>${esc(names[key] || key)}</span><span class="mode mode-${esc(mode)}">${esc(mode)}</span></li>`).join("");
  }

  async function renderDetail(id) {
    const [thread, branch] = [await getJson(`/v1/threads/${encodeURIComponent(id)}`), state.branches.find((b) => b.id === id)];
    const b = thread.branch;
    const parent = b.parentId ? `<a href="#branch=${esc(encodeURIComponent(b.parentId))}">${esc(b.parentId)}</a> <span class="faint">›</span>` : `<span class="faint">root</span> <span class="faint">›</span>`;
    const children = state.branches.filter((c) => c.parentId === b.id);
    const frozen = b.temperature === "frozen";
    const checkpoints = b.checkpoints.slice().reverse();
    const kvMeasured = thread.stats.cachedTokensSource === "measured";
    $("detail").innerHTML = `
      <div class="detail-head">
        <div class="row">
          <span class="chip t t-${esc(b.temperature)}"><span class="dot"></span>${esc(b.temperature)}</span>
          <span class="tag">${esc(b.kind)}</span>
          ${b.category !== b.kind ? `<span class="tag">${esc(b.category)}</span>` : ""}
          <span class="faint mono">${esc(b.modelRef)}</span>
        </div>
        <h2>${esc(b.title)}</h2>
        <p>${esc(b.responsibility)}</p>
        <div class="lineage">${parent} <code>${esc(b.id)}</code>
          ${children.length ? `<span class="faint">›</span> <span>${children.map((c) => `<a href="#branch=${esc(encodeURIComponent(c.id))}">${esc(c.id)}</a>`).join(`<span class="faint">, </span>`)}</span>` : ""}
          ${b.successorId ? `<span class="faint">· succeeded by</span> <a href="#branch=${esc(encodeURIComponent(b.successorId))}">${esc(b.successorId)}</a>` : ""}
        </div>
      </div>
      <div class="stats">
        <div><b>${thread.stats.messageCount}</b><span>messages</span></div>
        <div><b>${thread.stats.checkpointCount}</b><span>checkpoints</span></div>
        <div><b>${thread.stats.promptTokens ?? "—"}</b><span>${kvMeasured ? "prompt tokens · last turn" : "prompt tokens · estimate"}</span></div>
        <div title="${kvMeasured ? "Measured by llama-server (timings.cache_n): prompt tokens reused from the restored KV checkpoint on the last turn." : "Heuristic (words × 1.3, hot branches only). Not measured; the adapter has no native KV checkpoints."}"><b>${thread.stats.cachedTokens ?? "—"}</b><span>${kvMeasured ? "reused KV tokens · last turn" : "cached tokens · estimate"}</span></div>
      </div>
      <div class="section">
        <h3>Checkpoints</h3>
        ${checkpoints.length ? `<ol class="timeline">${checkpoints.map((c) => `
          <li class="${c.id === thread.headCheckpointId ? "head" : ""}">
            <span class="label">${esc(label(c))}${c.id === thread.headCheckpointId ? ` <span class="faint">· head</span>` : ""}</span>
            <span class="meta mono">${esc(c.id)}</span>
            <span class="meta">${ago(c.createdAt)}${c.summary ? ` · ${esc(c.summary)}` : ""}</span>
            ${c.id !== thread.headCheckpointId && !frozen ? `<button class="btn btn-small continue" type="button" data-checkpoint="${esc(c.id)}">Continue from here</button>` : ""}
          </li>`).join("")}</ol>` : `<div class="empty">No checkpoints on this branch yet.</div>`}
        <form class="composer" id="continueForm" hidden>
          <textarea name="content" rows="2" placeholder="Reply continuing from this checkpoint"></textarea>
          <div>
            <button class="btn" type="submit">Send from checkpoint</button>
            <button class="btn btn-ghost" type="button">Cancel</button>
          </div>
          <div class="hint" id="continueHint"></div>
          <div class="error" id="continueError"></div>
        </form>
      </div>
      <div class="section">
        <h3>Recent messages</h3>
        <div class="messages">${thread.recentMessages.length ? thread.recentMessages.map((m) => `
          <div class="msg ${esc(m.role)}"><div class="role">${esc(m.role)}</div><div class="bubble">${esc(m.content)}</div></div>`).join("") : `<div class="empty">Empty branch.</div>`}
        </div>
      </div>
      <div class="section">
        <h3>Continue this branch</h3>
        <form class="composer" id="composer">
          <textarea name="content" rows="2" placeholder="${frozen ? "Frozen branches are read-only." : "Send a turn: append, generate, checkpoint"}" ${frozen ? "disabled" : ""}></textarea>
          <button class="btn" type="submit" ${frozen ? "disabled" : ""}>Send turn</button>
        </form>
        <div class="hint"><code>POST /v1/threads/${esc(b.id)}/messages</code>${branch && branch.backend === "fake" ? " · the fake adapter echoes your message" : ""}</div>
        <div class="error" id="composerError"></div>
      </div>`;
    const form = $("composer");
    const sendButton = form.querySelector("button");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const content = form.content.value.trim();
      if (!content) return;
      sendButton.disabled = true;
      sendButton.textContent = "Generating…";
      try {
        await getJson(`/v1/threads/${encodeURIComponent(b.id)}/messages`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ message: { content } })
        });
        await refresh();
      } catch (error) {
        $("composerError").textContent = error.message;
        sendButton.disabled = false;
        sendButton.textContent = "Send turn";
      }
    });
    form.content.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) form.requestSubmit();
    });

    const continueForm = $("continueForm");
    continueForm.addEventListener("click", (event) => {
      if (event.target.closest("button[type=\"button\"]")) {
        continueForm.hidden = true;
        $("continueError").textContent = "";
      }
    });
    continueForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const content = continueForm.content.value.trim();
      if (!content) return;
      const submitButton = continueForm.querySelector("button[type=\"submit\"]");
      submitButton.disabled = true;
      submitButton.textContent = "Generating…";
      try {
        await getJson(`/v1/checkpoints/${encodeURIComponent(continueForm.dataset.checkpoint)}/respond`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ message: { content }, thread_id: b.id })
        });
        await refresh();
      } catch (error) {
        $("continueError").textContent = error.message;
        submitButton.disabled = false;
        submitButton.textContent = "Send from checkpoint";
      }
    });
  }

  $("tree").addEventListener("click", (event) => {
    const button = event.target.closest(".node");
    if (button) location.hash = `branch=${encodeURIComponent(button.dataset.id)}`;
  });
  // Checkpoint rows are re-rendered with the detail card; delegate clicks from #detail.
  $("detail").addEventListener("click", (event) => {
    const button = event.target.closest("button.continue");
    if (!button) return;
    const form = $("continueForm");
    if (!form) return;
    form.dataset.checkpoint = button.dataset.checkpoint;
    $("continueHint").textContent = `POST /v1/checkpoints/${button.dataset.checkpoint}/respond · continues from that checkpoint; the branch head moves to the new reply`;
    $("continueError").textContent = "";
    form.hidden = false;
    form.content.focus();
  });
  addEventListener("hashchange", () => {
    selected = branchFromHash(selected);
    renderTree();
    renderDetail(selected).catch(showError);
  });
  function showError(error) {
    $("adapterPill").textContent = "Lightning API unreachable";
    $("detail").innerHTML = `<div class="detail-head"><p class="error">${esc(error.message)}</p></div>`;
  }

  refresh().catch(showError);
  setInterval(() => { if (!document.hidden && !document.activeElement?.closest?.("#composer, #continueForm")) refresh().catch(() => {}); }, 5000);
})();
</script>
</body>
</html>
